openapi: 3.0.3
info:
  title: Billing Service API
  version: 1.0.0

paths:
  /api/v1/accounts/{accountId}/deposit:
    post:
      tags:
        - UserAccount
      operationId: depositAccount
      summary: Пополнение счёта
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequestDto'
      responses:
        200:
          description: Счёт пополнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        404:
          description: Счет не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        400:
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/v1/accounts:
    get:
      tags:
        - UserAccount
      operationId: getAccount
      summary: Получить счёт
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Успешное получение счета пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        404:
          description: Счет не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        400:
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

components:
  schemas:
    ErrorResponseDto:
      type: object
      description: Стандартный формат ответа при возникновении ошибки
      properties:
        code:
          type: integer
          format: int32
          description: Числовой код ошибки (например, HTTP статус или внутренний код)
          example: 400
        message:
          type: string
          description: Человеко-читаемое описание ошибки
          example: "Неверный формат электронной почты"
    DepositRequestDto:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          example: "100.50"
        currency:
          type: string
          example: "RUB"
    AccountDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        balance:
          type: string
        currency:
          type: string